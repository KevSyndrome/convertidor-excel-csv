<!-- Sección 1: Subir archivo -->
<div class="max-w-2xl mx-auto mb-8">
    <div class="bg-white rounded-2xl shadow-2xl p-8 border border-[#D6D1CA]">
        <h2 class="text-xl font-bold text-[#2C2927] mb-4 flex items-center">
            <span class="bg-[#99825d] text-white w-8 h-8 rounded-full flex items-center justify-center mr-3 text-sm">1</span>
            Subir archivo Excel
        </h2>
        
        <input type="file" name="archivo" id="archivo" accept=".xlsx,.xls" class="hidden" required>
        
        <div class="border-2 border-dashed border-[#99825d]/30 rounded-xl p-8 text-center cursor-pointer hover:border-[#99825d] hover:bg-[#99825d]/5 transition-all-300" 
             onclick="document.getElementById('archivo').click()" id="uploadArea">
            <div class="flex flex-col items-center">
                <svg class="w-16 h-16 text-[#99825d]/50 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                </svg>
                <p class="text-[#2C2927] font-medium text-lg" id="uploadText">Haz clic para seleccionar tu archivo</p>
                <p class="text-[#8B837C] mt-2">Archivos .xlsx o .xls</p>
            </div>
        </div>
        
        <div id="loader" class="hidden text-center py-6">
            <div class="inline-flex items-center px-4 py-2 bg-[#99825d]/10 rounded-lg">
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-[#99825d]" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="text-[#99825d] font-medium">Cargando columnas...</span>
            </div>
        </div>
    </div>
</div>
