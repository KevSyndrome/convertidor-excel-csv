<!-- Mensajes de alerta -->
<div class="max-w-4xl mx-auto mb-6">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="p-4 rounded-xl {% if category == 'success' %}bg-[#015E4F]/10 border border-[#015E4F] text-[#015E4F]{% else %}bg-[#CA104B]/10 border border-[#CA104B] text-[#CA104B]{% endif %} animate-fade-in mb-3">
                    <div class="flex items-center">
                        {% if category == 'success' %}
                            <svg class="w-5 h-5 mr-2 text-[#015E4F]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        {% else %}
                            <svg class="w-5 h-5 mr-2 text-[#CA104B]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        {% endif %}
                        <span>{{ message }}</span>
                        <button onclick="this.parentElement.parentElement.remove()" class="ml-auto text-[#8B837C] hover:text-[#2C2927]">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
</div>
